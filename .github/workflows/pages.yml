name: Deploy project page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble site with project files
        run: |
          mkdir site
          cp -R docs/. site/
          cp -R actuarydatacreating site/
          cp README.md site/
          sed -i 's#../actuarydatacreating/#actuarydatacreating/#g; s#../README.md#README.md#g' site/index.html
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site